name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  job-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run lint
        uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2.10.2
        with:
          fail_level: warning
          golangci_lint_flags: --timeout=5m

      - name: Run tests
        run: make ci

      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  job-integration:
    name: Integration test
    strategy:
      matrix:
        db: [mysql, postgres, sqlite]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start databases
        run: |
          docker compose up -d
          sleep 10s

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up usql
        uses: k1LoW/gh-setup@7c431c416c693b3c11df139e073e3f2e5fe2f5e0 # v1.12.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: xo/usql

      - name: Run integration test
        run: make integration_${{ matrix.db }}
